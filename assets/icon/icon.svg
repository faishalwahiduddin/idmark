<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: Deep Cyber Midnight Navy -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#070C1E"/>
      <stop offset="100%" stop-color="#02040A"/>
    </linearGradient>

    <!-- Cyan Security Radial Ambient Glow -->
    <radialGradient id="cyanGlow" cx="512" cy="480" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.16"/>
      <stop offset="80%" stop-color="#0369A1" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
    </radialGradient>

    <!-- Edge Vignette -->
    <radialGradient id="vignetteGrad" cx="512" cy="512" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>

    <!-- e-KTP Signature Cyan-Blue Card Surface -->
    <linearGradient id="cardGrad" x1="160" y1="270" x2="864" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#0EA5E9"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Card Header Gradient -->
    <linearGradient id="headerGrad" x1="160" y1="270" x2="864" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Gold Smart Chip Gradient -->
    <linearGradient id="chipGold" x1="400" y1="410" x2="510" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Watermark Stamp Red Ribbon Gradient (Translucent Digital Watermark) -->
    <linearGradient id="stampGrad" x1="80" y1="512" x2="944" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="35%" stop-color="#E11D48"/>
      <stop offset="70%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>

    <!-- Security Shield Gradient -->
    <linearGradient id="shieldGrad" x1="450" y1="360" x2="574" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FECDD3"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#000000" flood-opacity="0.68"/>
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="stampShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#BE123C" flood-opacity="0.40"/>
    </filter>

    <!-- Top Gloss Sheen -->
    <linearGradient id="topSheen" x1="0" y1="0" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="ktpClip"><rect width="1024" height="1024" rx="0"/></clipPath>
    <clipPath id="cardClip"><rect x="172" y="272" width="680" height="480" rx="38"/></clipPath>
  </defs>

  <g clip-path="url(#ktpClip)">
    <!-- Base Background & Ambient Lighting -->
    <rect width="1024" height="1024" fill="url(#bgGrad)"/>
    <rect width="1024" height="1024" fill="url(#cyanGlow)"/>
    <rect width="1024" height="1024" fill="url(#vignetteGrad)"/>

    <!-- Subtle Security Grid Dots -->
    <g opacity="0.18" fill="#38BDF8">
      <circle cx="120" cy="180" r="3.5"/><circle cx="200" cy="180" r="3.5"/><circle cx="824" cy="180" r="3.5"/><circle cx="904" cy="180" r="3.5"/>
      <circle cx="120" cy="844" r="3.5"/><circle cx="200" cy="844" r="3.5"/><circle cx="824" cy="844" r="3.5"/><circle cx="904" cy="844" r="3.5"/>
    </g>

    <!-- ==================== MAIN E-KTP CARD ==================== -->
    <g filter="url(#cardShadow)">
      <!-- Outer Card Bezel / Rim -->
      <rect x="168" y="268" width="688" height="488" rx="42" fill="#E0F2FE" opacity="0.85"/>
      <!-- Card Body -->
      <rect x="172" y="272" width="680" height="480" rx="38" fill="url(#cardGrad)"/>

      <!-- Card Interior Elements (Clipped to Card Boundary) -->
      <g clip-path="url(#cardClip)">
        <!-- Security Guilloche Wave Patterns -->
        <path d="M 172 380 Q 340 330, 512 400 T 852 370" fill="none" stroke="#BAE6FD" stroke-width="2.5" opacity="0.35"/>
        <path d="M 172 440 Q 340 390, 512 460 T 852 430" fill="none" stroke="#BAE6FD" stroke-width="2.5" opacity="0.30"/>
        <path d="M 172 510 Q 340 460, 512 530 T 852 500" fill="none" stroke="#BAE6FD" stroke-width="2.5" opacity="0.25"/>
        <path d="M 172 580 Q 340 530, 512 600 T 852 570" fill="none" stroke="#BAE6FD" stroke-width="2.5" opacity="0.25"/>

        <!-- Header Strip: PROVINSI / REPUBLIK INDONESIA -->
        <rect x="172" y="272" width="680" height="76" fill="url(#headerGrad)"/>
        <rect x="360" y="292" width="310" height="14" rx="7" fill="#FFFFFF" opacity="0.95"/>
        <rect x="420" y="316" width="190" height="10" rx="5" fill="#BAE6FD" opacity="0.85"/>
        <!-- Mini Coat-of-Arms Crest Emblem in Header -->
        <polygon points="310,292 322,306 322,324 310,332 298,324 298,306" fill="#FDE047" opacity="0.95"/>

        <!-- NIK Bar (National Identity Number Header) -->
        <rect x="360" y="375" width="280" height="18" rx="6" fill="#FFFFFF" opacity="0.95"/>

        <!-- Photo Avatar Frame (Left Side) -->
        <g id="photoBox">
          <rect x="212" y="375" width="128" height="162" rx="14" fill="#0369A1" stroke="#FFFFFF" stroke-width="4.5"/>
          <!-- Avatar User Silhouette -->
          <circle cx="276" cy="430" r="30" fill="#E0F2FE"/>
          <path d="M 234 526 C 234 482, 250 472, 276 472 C 302 472, 318 482, 318 526 Z" fill="#E0F2FE"/>
        </g>

        <!-- Signature Area Below Photo -->
        <rect x="212" y="556" width="128" height="52" rx="8" fill="#075985" opacity="0.6"/>
        <path d="M 226 584 Q 248 562, 268 588 T 310 574" fill="none" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round"/>

        <!-- Golden Smart Chip (e-KTP Contact Chip) -->
        <g id="smartChip" transform="translate(360, 415)">
          <rect x="0" y="0" width="98" height="80" rx="12" fill="url(#chipGold)" stroke="#FEF3C7" stroke-width="3"/>
          <line x1="0" y1="28" x2="98" y2="28" stroke="#92400E" stroke-width="2.5"/>
          <line x1="0" y1="52" x2="98" y2="52" stroke="#92400E" stroke-width="2.5"/>
          <line x1="34" y1="0" x2="34" y2="80" stroke="#92400E" stroke-width="2.5"/>
          <line x1="64" y1="0" x2="64" y2="80" stroke="#92400E" stroke-width="2.5"/>
          <rect x="38" y="32" width="22" height="16" rx="4" fill="#FEF3C7" opacity="0.85"/>
        </g>

        <!-- e-KTP Data Field Skeleton Lines -->
        <g id="dataLines" fill="#FFFFFF" opacity="0.85">
          <!-- Nama -->
          <rect x="480" y="420" width="210" height="13" rx="5"/>
          <rect x="480" y="442" width="310" height="10" rx="5" fill="#E0F2FE" opacity="0.75"/>
          <!-- Tempat/Tgl Lahir -->
          <rect x="480" y="465" width="170" height="10" rx="5"/>
          <rect x="480" y="484" width="250" height="10" rx="5" fill="#E0F2FE" opacity="0.75"/>
          <!-- Alamat -->
          <rect x="360" y="520" width="190" height="11" rx="5"/>
          <rect x="360" y="540" width="290" height="10" rx="5" fill="#E0F2FE" opacity="0.75"/>
          <!-- Agama / Status -->
          <rect x="360" y="568" width="230" height="11" rx="5"/>
          <rect x="360" y="588" width="270" height="10" rx="5" fill="#E0F2FE" opacity="0.75"/>
        </g>

        <!-- Holographic Globe Emblem (Bottom-Right) -->
        <circle cx="780" cy="670" r="34" fill="none" stroke="#FDE047" stroke-width="3" opacity="0.85"/>
        <path d="M 750 670 Q 780 648, 810 670 Q 780 692, 750 670" fill="none" stroke="#FDE047" stroke-width="2" opacity="0.75"/>
        <ellipse cx="780" cy="670" rx="17" ry="34" fill="none" stroke="#FDE047" stroke-width="2" opacity="0.75"/>
      </g>
    </g>

    <!-- ==================== HERO WATERMARK STAMP & PRIVACY SHIELD ==================== -->
    <!-- Authentic Diagonal Watermark Stamp Ribbon (-14 deg) across card -->
    <g filter="url(#stampShadow)" transform="rotate(-14 512 512)">
      <!-- Diagonal Watermark Ribbon Banner (Semi-translucent 0.90 to show e-KTP beneath) -->
      <rect x="80" y="446" width="864" height="132" rx="22" fill="url(#stampGrad)" opacity="0.94"/>
      
      <!-- Top & Bottom Dotted / Dashed Stamp Border -->
      <line x1="100" y1="458" x2="924" y2="458" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="16 12" opacity="0.95"/>
      <line x1="100" y1="566" x2="924" y2="566" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="16 12" opacity="0.95"/>

      <!-- Watermark Security Diagonal Pattern Lines on Wings -->
      <g stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8 8" opacity="0.45">
        <line x1="140" y1="466" x2="190" y2="558"/>
        <line x1="180" y1="466" x2="230" y2="558"/>
        <line x1="220" y1="466" x2="270" y2="558"/>
        <line x1="260" y1="466" x2="310" y2="558"/>
        <line x1="300" y1="466" x2="350" y2="558"/>
        
        <line x1="674" y1="466" x2="724" y2="558"/>
        <line x1="714" y1="466" x2="764" y2="558"/>
        <line x1="754" y1="466" x2="804" y2="558"/>
        <line x1="794" y1="466" x2="844" y2="558"/>
        <line x1="834" y1="466" x2="884" y2="558"/>
      </g>

      <!-- Left Stamp Seal: Official Checkmark Medallion -->
      <g transform="translate(240, 512)">
        <circle cx="0" cy="0" r="38" fill="#881337" stroke="#FFFFFF" stroke-width="4.5"/>
        <path d="M -16 0 L -5 11 L 16 -10" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Right Stamp Seal: On-Device Privacy Lock -->
      <g transform="translate(784, 512)">
        <circle cx="0" cy="0" r="38" fill="#881337" stroke="#FFFFFF" stroke-width="4.5"/>
        <!-- Padlock Body -->
        <rect x="-14" y="-5" width="28" height="24" rx="5" fill="#FFFFFF"/>
        <!-- Padlock Shackle -->
        <path d="M -10 -5 A 10 10 0 0 1 10 -5 L 10 2 L -10 2 Z" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
        <!-- Keyhole -->
        <circle cx="0" cy="5" r="3.5" fill="#BE123C"/>
        <polygon points="-2,5 2,5 3,13 -3,13" fill="#BE123C"/>
      </g>

      <!-- Center Grand Privacy Shield Seal -->
      <g id="shieldMedallion" transform="translate(512, 512)">
        <!-- Outer Glowing Badge Circle -->
        <circle cx="0" cy="0" r="88" fill="#881337" stroke="#FFFFFF" stroke-width="8"/>
        <circle cx="0" cy="0" r="74" fill="url(#stampGrad)"/>

        <!-- Security Privacy Shield -->
        <path d="M 0 -50 L 40 -30 C 40 20, 22 50, 0 64 C -22 50, -40 20, -40 -30 Z" 
              fill="url(#shieldGrad)" stroke="#FFFFFF" stroke-width="4"/>

        <!-- Padlock / Keyhole Emblem inside Shield -->
        <!-- Shackle -->
        <path d="M -16 -16 A 16 16 0 0 1 16 -16 L 16 -4 L -16 -4 Z" fill="none" stroke="#BE123C" stroke-width="7" stroke-linecap="round"/>
        <!-- Lock Body -->
        <rect x="-20" y="-6" width="40" height="32" rx="7" fill="#BE123C"/>
        <!-- Keyhole -->
        <circle cx="0" cy="6" r="5" fill="#FFFFFF"/>
        <polygon points="-3,6 3,6 4,16 -4,16" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Top Gloss Sheen Overlay -->
    <rect width="1024" height="340" fill="url(#topSheen)"/>
  </g>
</svg>
