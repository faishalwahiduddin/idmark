<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: Cybersecurity Cyan-Cobalt -->
    <linearGradient id="idBg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Electric Cyan Ambient Glow -->
    <radialGradient id="idGlow" cx="512" cy="400" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#0EA5E9" stop-opacity="0.18"/>
      <stop offset="85%" stop-color="#0369A1" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Edge Vignette -->
    <radialGradient id="idVignette" cx="512" cy="512" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="65%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0C4A6E" stop-opacity="0.25"/>
    </radialGradient>

    <!-- Clean Card Surface -->
    <linearGradient id="cardGrad" x1="200" y1="260" x2="824" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Card Header Strip -->
    <linearGradient id="cardHeader" x1="200" y1="260" x2="824" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Golden Smart Chip -->
    <linearGradient id="chipGold" x1="390" y1="420" x2="490" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Crimson Watermark Stamp Ribbon -->
    <linearGradient id="stampGrad" x1="100" y1="512" x2="924" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="40%" stop-color="#E11D48"/>
      <stop offset="80%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="32" stdDeviation="34" flood-color="#0C4A6E" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="stampShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Top Gloss Sheen -->
    <linearGradient id="topSheen" x1="0" y1="0" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#idBg)"/>
  <rect width="1024" height="1024" fill="url(#idGlow)"/>
  <rect width="1024" height="1024" fill="url(#idVignette)"/>

  <!-- ==================== CLEAN FLOATING ID CARD ==================== -->
  <g filter="url(#cardShadow)">
    <!-- Base Card Body -->
    <rect x="192" y="270" width="640" height="484" rx="36" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Header Strip -->
    <rect x="192" y="270" width="640" height="74" rx="36" fill="url(#cardHeader)"/>
    <rect x="192" y="308" width="640" height="36" fill="url(#cardHeader)"/>
    <rect x="360" y="292" width="300" height="12" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <rect x="420" y="314" width="180" height="8" rx="4" fill="#BAE6FD" opacity="0.85"/>

    <!-- Left Avatar Photo Frame -->
    <rect x="236" y="378" width="128" height="156" rx="14" fill="#0284C7" stroke="#BAE6FD" stroke-width="3"/>
    <circle cx="300" cy="432" r="28" fill="#FFFFFF"/>
    <path d="M 258 524 C 258 480, 276 472, 300 472 C 324 472, 342 480, 342 524 Z" fill="#FFFFFF"/>

    <!-- Golden Smart Chip -->
    <rect x="396" y="378" width="94" height="76" rx="10" fill="url(#chipGold)" stroke="#FEF3C7" stroke-width="2.5"/>
    <line x1="396" y1="404" x2="490" y2="404" stroke="#92400E" stroke-width="2"/>
    <line x1="396" y1="428" x2="490" y2="428" stroke="#92400E" stroke-width="2"/>
    <line x1="428" y1="378" x2="428" y2="454" stroke="#92400E" stroke-width="2"/>
    <line x1="458" y1="378" x2="458" y2="454" stroke="#92400E" stroke-width="2"/>

    <!-- Minimal Identity Lines -->
    <rect x="520" y="386" width="230" height="14" rx="7" fill="#0284C7"/>
    <rect x="520" y="414" width="180" height="10" rx="5" fill="#94A3B8"/>
    <rect x="520" y="434" width="220" height="10" rx="5" fill="#CBD5E1"/>

    <rect x="396" y="480" width="354" height="10" rx="5" fill="#94A3B8"/>
    <rect x="396" y="504" width="290" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="396" y="528" width="230" height="10" rx="5" fill="#CBD5E1"/>

    <!-- Signature Strip -->
    <rect x="236" y="556" width="128" height="42" rx="8" fill="#E2E8F0"/>
    <path d="M 252 578 Q 274 560, 296 584 T 342 572" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ==================== CLEAN WATERMARK STAMP BANNER ==================== -->
  <g filter="url(#stampShadow)" transform="rotate(-12 512 512)">
    <!-- Watermark Banner -->
    <rect x="96" y="452" width="832" height="120" rx="22" fill="url(#stampGrad)" opacity="0.95"/>
    <line x1="116" y1="466" x2="908" y2="466" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="14 10" opacity="0.9"/>
    <line x1="116" y1="558" x2="908" y2="558" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="14 10" opacity="0.9"/>

    <!-- Clean Watermark Inner Stamp Frame -->
    <rect x="170" y="474" width="684" height="76" rx="12" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.75"/>

    <!-- Watermark Stamp Text -->
    <text x="512" y="527" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-weight="900" 
          font-size="48" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="12"
          opacity="0.98">WATERMARK</text>
  </g>

  <!-- Top Sheen Gloss -->
  <rect width="1024" height="340" fill="url(#topSheen)"/>
</svg>
