flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  image_path_android: "assets/icon/icon-rounded.png"

  # Android
  android: true
  min_sdk_android: 21

  # iOS
  ios: true
  remove_alpha_ios: true

  # Web
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0B132B"
    theme_color: "#0EA5E9"
