name: ktpmark
description: "KtpMark — Watermark eKTP & Identitas Aman: bubuhkan cap tujuan & tanggal pada foto eKTP on-device untuk cegah penyalahgunaan data pinjol & verifikasi"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  share_plus: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

