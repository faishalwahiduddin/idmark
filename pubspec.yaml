name: idmark
description: "IDMark — Secure ID Card & Document Watermark: Stamp custom purpose & date onto national IDs, e-KTP, passports, and driver's licenses 100% on-device."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  share_plus: ^12.0.0
  crypto: ^3.0.7
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/
